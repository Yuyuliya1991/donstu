<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ДГТУ Расписание</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0a1628 0%, #1a2a4a 100%); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: flex-start; }
        .container { max-width: 1100px; width: 100%; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 32px; padding: 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); margin-top: 10px; }
        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid rgba(255,200,0,0.2); padding-bottom: 16px; }
        .header h1 { color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: 1px; }
        .header h1 span { color: #ffc800; }

        .week-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 6px 0 14px 0; flex-wrap: nowrap; }
        .week-nav button { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: #ffffff; padding: 6px 18px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 500; transition: background 0.2s; white-space: nowrap; }
        .week-nav button:hover { background: rgba(255,200,0,0.15); }
        .week-label { color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 500; min-width: 150px; text-align: center; white-space: nowrap; }

        .days-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 6px 0 16px 0; max-width: 500px; margin: 0 auto; }
        .day-btn { padding: 10px 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 40px; color: rgba(255,255,255,0.6); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.25s ease; text-align: center; white-space: nowrap; }
        .day-btn:hover { background: rgba(255,200,0,0.12); color: #fff; }
        .day-btn.active { background: #ffc800; color: #0a1628; border-color: #ffc800; box-shadow: 0 4px 20px rgba(255,200,0,0.25); }
        .day-btn .day-date { display: block; font-size: 11px; font-weight: 400; opacity: 0.5; margin-top: 2px; }
        .day-btn.active .day-date { opacity: 0.7; }

        .girls-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 6px; }
        .girl-card { background: rgba(255,255,255,0.04); border-radius: 24px; padding: 18px 20px 20px; border: 1px solid rgba(255,255,255,0.06); transition: border-color 0.2s; }
        .girl-card:hover { border-color: rgba(255,200,0,0.15); }
        .girl-name { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 10px; }

        .lesson-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-wrap: wrap;
        }
        .lesson-row:last-child { border-bottom: none; }

        .lesson-room-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 60px;
            flex-shrink: 0;
            flex-wrap: nowrap;
        }

        .lesson-room {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 16px;
        }

        .room-toggle {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: transparent;
            border: 1px solid rgba(255,107,107,0.2);
            color: #ff6b6b;
            font-size: 13px;
            padding: 0 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            line-height: 24px;
            font-weight: 600;
        }
        .room-toggle:hover {
            background: rgba(255,107,107,0.1);
            border-color: rgba(255,107,107,0.4);
        }
        .room-toggle.active {
            background: rgba(255,107,107,0.15);
            border-color: #ff6b6b;
        }
        .room-toggle .arrow {
            display: inline-block;
            transition: transform 0.25s ease;
            font-size: 10px;
        }
        .room-toggle.active .arrow {
            transform: rotate(180deg);
        }

        /* ===== ВЫПАДАЮЩИЙ СПИСОК (в строчку) ===== */
        .room-dropdown {
            display: none;
            width: 100%;
            padding: 6px 0 2px 12px;
            margin-top: 4px;
            border-left: 2px solid rgba(255,107,107,0.1);
            background: rgba(255,255,255,0.02);
            border-radius: 0 0 8px 8px;
            white-space: nowrap;
        }
        .room-dropdown.open {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
        }
        .room-dropdown .room-item {
            display: inline-flex;
            align-items: baseline;
            gap: 6px;
            padding: 4px 0;
            white-space: nowrap;
            border-bottom: none;
        }
        .room-dropdown .room-item .r-aud {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: 500;
        }
        .room-dropdown .room-item .r-subgroup {
            color: rgba(255,255,255,0.35);
            font-size: 12px;
        }

        /* ===== ИСПРАВЛЕННЫЙ .lesson-name ===== */
        .lesson-info { 
            flex: 1; 
            min-width: 0; 
            padding: 0 14px; 
        }
        .lesson-name { 
            color: rgba(255,255,255,0.85); 
            font-size: 16px; 
            font-weight: 500; 
            word-break: normal; 
            white-space: normal; 
            overflow-wrap: break-word; 
        }

        .lesson-time { color: #ffd93d; font-weight: 700; font-size: 17px; white-space: nowrap; flex-shrink: 0; text-shadow: 0 0 20px rgba(255, 217, 61, 0.25); letter-spacing: 0.3px; }

        .girl-empty { color: rgba(255,255,255,0.25); text-align: center; padding: 20px 0; font-size: 14px; }
        .girl-loader { color: rgba(255,255,255,0.4); text-align: center; padding: 20px 0; font-size: 14px; }
        .girl-error { color: #ff6b6b; text-align: center; padding: 14px 0; font-size: 13px; background: rgba(255,0,0,0.06); border-radius: 12px; }

        .footer { text-align: center; margin-top: 30px; color: rgba(255,255,255,0.15); font-size: 12px; border-top: 1px solid rgba(255,255,255,0.04); padding-top: 18px; }

        @media (max-width: 600px) {
            .container { padding: 16px; }
            .header h1 { font-size: 22px; }
            .girls-grid { grid-template-columns: 1fr; }
            .lesson-row { gap: 4px; padding: 8px 0; }
            .lesson-room-wrapper { min-width: 50px; }
            .lesson-room { font-size: 14px; }
            .lesson-time { font-size: 15px; }
            .lesson-name { font-size: 14px; }
            .room-toggle { font-size: 12px; padding: 0 8px; line-height: 22px; }
            .days-nav { grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 100%; }
            .day-btn { font-size: 13px; padding: 8px 4px; border-radius: 30px; }
            .day-btn .day-date { font-size: 10px; }
            .week-nav { gap: 8px; }
            .week-nav button { font-size: 12px; padding: 4px 12px; }
            .week-label { font-size: 12px; min-width: 100px; }
        }
        @media (max-width: 400px) {
            .days-nav { grid-template-columns: repeat(3, 1fr); gap: 4px; }
            .day-btn { font-size: 11px; padding: 6px 2px; border-radius: 20px; }
            .day-btn .day-date { font-size: 9px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>ДГТУ <span>Расписание</span></h1>
        </div>

        <div class="week-nav">
            <button id="prevWeek">◀ Пред. неделя</button>
            <span class="week-label" id="weekLabel">Загрузка...</span>
            <button id="nextWeek">След. неделя ▶</button>
        </div>

        <div class="days-nav" id="daysNav"></div>

        <div class="girls-grid" id="girlsGrid"></div>

        <div class="footer">Данные загружены с API ДГТУ</div>
    </div>

    <script>
        // ===================================================
        // ВСЕ ПОДРУГИ
        // ===================================================
        const GIRLS = [
            { name: 'Юля', groupId: 73351 },
            { name: 'Маша', groupId: 73309 },
            { name: 'Полина', groupId: 73460 },
            { name: 'Вероника', groupId: 73310 },
            { name: 'Злата', groupId: 73377 },
            { name: 'Ульяна', groupId: 73328 }
        ];

        let currentDay = 3;
        let currentMonday = null;
        let allData = {};

        const dayNames = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота'];

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function getMonday(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            d.setDate(diff);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function formatDate(d) {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function formatDateShort(d) {
            return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
        }

        function addWeeks(date, weeks) {
            const d = new Date(date);
            d.setDate(d.getDate() + weeks * 7);
            return d;
        }

        // ---------- ЗАГРУЗКА РАСПИСАНИЯ ----------
        async function fetchSchedule(groupId, monday) {
            const url = `https://edu.donstu.ru/api/Rasp?idGroup=${groupId}&sdate=${formatDate(monday)}`;
            try {
                const resp = await fetch(url);
                if (!resp.ok) return null;
                return await resp.json();
            } catch {
                return null;
            }
        }

        // ---------- ПАРСИНГ ----------
        function parseSchedule(apiData, targetDay) {
            if (!apiData || apiData.state !== 1) return [];

            const raspArray = apiData.data?.rasp || [];
            const rawLessons = [];

            raspArray.forEach(item => {
                if (item.деньНедели === targetDay) {
                    let name = item.дисциплина || 'Без названия';
                    name = name.replace(/^(лек|пр|лаб)\s*/i, '').trim();

                    let subgroup = '';
                    const subgroupMatch = name.match(/,\s*п\/г\s*(\d+)/i);
                    if (subgroupMatch) {
                        subgroup = `п/г ${subgroupMatch[1]}`;
                        name = name.replace(/,\s*п\/г\s*\d+/i, '').trim();
                    }

                    rawLessons.push({
                        time: `${item.начало} – ${item.конец}`,
                        start: item.начало,
                        end: item.конец,
                        name: name,
                        room: item.аудитория || '',
                        subgroup: subgroup
                    });
                }
            });

            rawLessons.sort((a, b) => a.start.localeCompare(b.start));

            const merged = [];
            let current = null;

            rawLessons.forEach(lesson => {
                const key = lesson.start + lesson.end + lesson.name;
                if (!current || current.key !== key) {
                    current = {
                        key: key,
                        time: lesson.time,
                        start: lesson.start,
                        end: lesson.end,
                        name: lesson.name,
                        rooms: [{ room: lesson.room, subgroup: lesson.subgroup }]
                    };
                    merged.push(current);
                } else {
                    const exists = current.rooms.some(r => r.room === lesson.room && r.subgroup === lesson.subgroup);
                    if (!exists && lesson.room) {
                        current.rooms.push({ room: lesson.room, subgroup: lesson.subgroup });
                    }
                }
            });

            return merged.map(item => ({
                time: item.time,
                start: item.start,
                end: item.end,
                name: item.name,
                rooms: item.rooms.filter(r => r.room && r.room.trim() !== '')
            }));
        }

        // ---------- ОТОБРАЖЕНИЕ ----------
        function renderAll() {
            if (currentMonday) {
                const end = new Date(currentMonday);
                end.setDate(end.getDate() + 6);
                document.getElementById('weekLabel').textContent =
                    `${formatDateShort(currentMonday)} – ${formatDateShort(end)}`;
            }

            renderDayButtons();

            const grid = document.getElementById('girlsGrid');
            let html = '';

            GIRLS.forEach(girl => {
                const lessons = allData[girl.groupId] || [];

                let scheduleHtml = '';
                if (lessons.length === 0) {
                    scheduleHtml = `<div class="girl-empty">🎉 В этот день пар нет</div>`;
                } else {
                    lessons.forEach((lesson, lessonIndex) => {
                        const rooms = lesson.rooms || [];
                        const moreCount = rooms.length;
                        const uniqueId = `rooms-${girl.groupId}-${lessonIndex}-${Date.now()}`;

                        const allRoomsHtml = rooms.map(r => `
                            <div class="room-item">
                                <span class="r-aud">${r.room}</span>
                                ${r.subgroup ? `<span class="r-subgroup">${r.subgroup}</span>` : ''}
                            </div>
                        `).join('');

                        scheduleHtml += `
                            <div class="lesson-row">
                                <div class="lesson-room-wrapper">
                                    ${moreCount > 1 ? `
                                        <button class="room-toggle" data-target="${uniqueId}">
                                            Ауд. <span class="arrow">▼</span>
                                        </button>
                                    ` : `
                                        <span class="lesson-room">${rooms[0]?.room || '—'}</span>
                                    `}
                                    ${moreCount > 1 ? `
                                        <div class="room-dropdown" id="${uniqueId}">
                                            ${allRoomsHtml}
                                        </div>
                                    ` : ''}
                                </div>
                                <div class="lesson-info">
                                    <div class="lesson-name">${lesson.name}</div>
                                </div>
                                <div class="lesson-time">${lesson.time}</div>
                            </div>
                        `;
                    });
                }

                html += `
                    <div class="girl-card">
                        <div class="girl-name">${girl.name}</div>
                        <div class="girl-schedule">${scheduleHtml}</div>
                    </div>
                `;
            });

            grid.innerHTML = html;

            // ====== ОБРАБОТЧИК ДЛЯ КНОПОК "Ауд. ▼" ======
            document.querySelectorAll('.room-toggle').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const targetId = this.dataset.target;
                    const list = document.getElementById(targetId);
                    if (!list) return;

                    const isOpen = list.classList.toggle('open');
                    this.classList.toggle('active');
                });
            });
        }

        // ---------- КНОПКИ ДНЕЙ ----------
        function renderDayButtons() {
            const nav = document.getElementById('daysNav');
            nav.innerHTML = '';

            for (let i = 0; i < 6; i++) {
                const btn = document.createElement('button');
                btn.className = 'day-btn' + (i + 1 === currentDay ? ' active' : '');
                btn.dataset.day = i + 1;

                const targetDate = new Date(currentMonday);
                targetDate.setDate(currentMonday.getDate() + i);
                const dateStr = formatDateShort(targetDate);

                btn.innerHTML = `${dayNames[i]} <span class="day-date">${dateStr}</span>`;

                btn.addEventListener('click', () => {
                    setDay(i + 1);
                });

                nav.appendChild(btn);
            }
        }

        // ---------- ЗАГРУЗКА ДАННЫХ ----------
        async function loadAllSchedules() {
            if (!currentMonday) {
                currentMonday = getMonday(new Date());
            }

            allData = {};
            GIRLS.forEach(g => { allData[g.groupId] = null; });

            const promises = GIRLS.map(async (girl) => {
                const data = await fetchSchedule(girl.groupId, currentMonday);
                if (data) {
                    allData[girl.groupId] = parseSchedule(data, currentDay);
                } else {
                    allData[girl.groupId] = [];
                }
            });

            await Promise.all(promises);
            renderAll();
        }

        // ---------- ПЕРЕКЛЮЧЕНИЕ ----------
        function setDay(day) {
            if (day < 1 || day > 6) return;
            currentDay = day;
            loadAllSchedules();
        }

        function setWeekOffset(weeks) {
            if (!currentMonday) {
                currentMonday = getMonday(new Date());
            }
            currentMonday = addWeeks(currentMonday, weeks);
            loadAllSchedules();
        }

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            const today = new Date().getDay();
            if (today >= 1 && today <= 6) {
                currentDay = today;
            } else {
                currentDay = 3;
            }

            currentMonday = getMonday(new Date());

            document.getElementById('prevWeek').addEventListener('click', () => setWeekOffset(-1));
            document.getElementById('nextWeek').addEventListener('click', () => setWeekOffset(1));

            loadAllSchedules();
            setInterval(loadAllSchedules, 10 * 60 * 1000);
        }

        init();
    </script>
</body>
</html>
